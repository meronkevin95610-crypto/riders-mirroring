name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: Release

jobs:
  test:
    name: Build & test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Core
        run: dotnet restore src/RidersMirroring.Core/RidersMirroring.Core.csproj

      - name: Restore Desktop
        run: dotnet restore src/RidersMirroring.Desktop/RidersMirroring.Desktop.csproj

      - name: Restore Core.Tests
        run: dotnet restore tests/RidersMirroring.Core.Tests/RidersMirroring.Core.Tests.csproj

      - name: Restore Desktop.Tests
        run: dotnet restore tests/RidersMirroring.Desktop.Tests/RidersMirroring.Desktop.Tests.csproj

      - name: Build Core
        run: dotnet build src/RidersMirroring.Core/RidersMirroring.Core.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Build Desktop
        run: dotnet build src/RidersMirroring.Desktop/RidersMirroring.Desktop.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Build Core.Tests
        run: dotnet build tests/RidersMirroring.Core.Tests/RidersMirroring.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Build Desktop.Tests
        run: dotnet build tests/RidersMirroring.Desktop.Tests/RidersMirroring.Desktop.Tests.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test Core
        run: dotnet test tests/RidersMirroring.Core.Tests/RidersMirroring.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --nologo

      - name: Test Desktop
        run: dotnet test tests/RidersMirroring.Desktop.Tests/RidersMirroring.Desktop.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --nologo
