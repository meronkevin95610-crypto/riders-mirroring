name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: Release

jobs:
  release:
    name: Build MSI + publish GitHub Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Core
        run: dotnet restore src/RidersMirroring.Core/RidersMirroring.Core.csproj

      - name: Restore Desktop
        run: dotnet restore src/RidersMirroring.Desktop/RidersMirroring.Desktop.csproj

      - name: Restore Core.Tests
        run: dotnet restore tests/RidersMirroring.Core.Tests/RidersMirroring.Core.Tests.csproj

      - name: Restore Desktop.Tests
        run: dotnet restore tests/RidersMirroring.Desktop.Tests/RidersMirroring.Desktop.Tests.csproj

      - name: Restore Installer
        run: dotnet restore installer/RidersMirroring.Installer/RidersMirroring.Installer.wixproj

      - name: Build Core
        run: dotnet build src/RidersMirroring.Core/RidersMirroring.Core.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Build Desktop
        run: dotnet build src/RidersMirroring.Desktop/RidersMirroring.Desktop.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Build Core.Tests
        run: dotnet build tests/RidersMirroring.Core.Tests/RidersMirroring.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Build Desktop.Tests
        run: dotnet build tests/RidersMirroring.Desktop.Tests/RidersMirroring.Desktop.Tests.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test Core
        run: dotnet test tests/RidersMirroring.Core.Tests/RidersMirroring.Core.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --nologo

      - name: Test Desktop
        run: dotnet test tests/RidersMirroring.Desktop.Tests/RidersMirroring.Desktop.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build --nologo

      - name: Install WiX 4
        run: dotnet tool install --global wix --version 4.0.5

      - name: Publish Desktop (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/RidersMirroring.Desktop/RidersMirroring.Desktop.csproj `
            -c ${{ env.CONFIGURATION }} `
            -r win-x64 `
            --self-contained false `
            -p:PublishDir="${{ github.workspace }}\installer\RidersMirroring.Installer\publish\win-x64" `
            -p:WindowsPackageType=None

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref.StartsWith("refs/tags/")) {
            $tag = $ref.Substring("refs/tags/".Length)
          } else {
            $tag = "v1.0.0"
          }
          $version = $tag.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Building version $version from tag $tag"

      - name: Build MSI
        working-directory: installer/RidersMirroring.Installer
        run: >-
          dotnet build
          -c ${{ env.CONFIGURATION }}
          -p:Platform=x64
          /p:Version=${{ env.VERSION }}
          /p:UpgradeCode=B5E3C561-2A1B-4E3E-8DF3-1F44E72B9611
          /p:ProductCode=*

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path installer/RidersMirroring.Installer/bin -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msi) {
            Write-Host "::error::No .msi produced"
            exit 1
          }
          "MSI_PATH=$($msi.FullName)" >> $env:GITHUB_ENV
          "MSI_NAME=$($msi.Name)" >> $env:GITHUB_ENV
          Write-Host "MSI: $($msi.FullName) ($([math]::Round($msi.Length / 1KB, 1)) KB)"

      - name: Compute SHA256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path $env:MSI_PATH -Algorithm SHA256).Hash.ToLower()
          "MSI_SHA256=$hash" >> $env:GITHUB_ENV
          Write-Host "SHA256: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Riders Mirroring ${{ env.VERSION }}
          generate_release_notes: true
          files: ${{ env.MSI_PATH }}
          body: |
            ## Riders Mirroring ${{ env.VERSION }}

            Application Windows pour afficher et contrôler ton téléphone Android
            sur ton PC. Multi-device, onglets chrome-style, décodage H.264 in-app.

            ### Installation

            1. Télécharge `RidersMirroring-${{ env.VERSION }}.msi`
            2. Double-clique pour installer (Windows 10 / 11 — 64 bits)
            3. Branche un Android en USB (active le débogage USB) ou en Wi-Fi

            **SHA256** : `${{ env.MSI_SHA256 }}`

            ### Liens

            - Site : https://meronkevin95610-crypto.github.io/riders-mirroring/
            - Code source : https://github.com/meronkevin95610-crypto/riders-mirroring
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
